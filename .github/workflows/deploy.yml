name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define="OMDB_KEY=${{ secrets.OMDB_KEY }}"
          --dart-define="CMS_URL=${{ vars.CMS_URL }}"
          --dart-define="SANITY_PROJECT_ID=${{ vars.SANITY_PROJECT_ID }}"
          --dart-define="SANITY_DATASET=${{ vars.SANITY_DATASET }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set artifact name
        id: artifact_name
        run: |
          echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}